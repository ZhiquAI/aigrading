<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能批改助手 - 浏览器插件演示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #e5e5e5;
            font-family: system-ui, sans-serif;
        }

        .browser-window {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .browser-toolbar {
            height: 40px;
            background: #f3f3f3;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
        }

        .url-bar {
            flex: 1;
            height: 28px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 14px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 13px;
            color: #333;
        }

        .extension-icon {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .extension-icon:hover {
            background: #e0e0e0;
        }

        .extension-icon.active {
            background: #d0d7de;
            color: #0969da;
        }

        .browser-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .web-page {
            flex: 1;
            background: #f9f9f9;
            overflow-y: auto;
            position: relative;
        }

        .third-party-header {
            height: 50px;
            background: #008080;
            /* Teal theme simulating the screenshot */
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
        }

        .side-panel-container {
            width: 400px;
            border-left: 1px solid #ccc;
            background: #fff;
            display: flex;
            flex-direction: column;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.05);
            transition: width 0.3s ease;
        }

        .side-panel-container.collapsed {
            width: 0;
            border-left: none;
        }
    </style>
</head>

<body>

    <div class="browser-window">
        <!-- Mock Browser Toolbar -->
        <div class="browser-toolbar">
            <div class="flex gap-2 text-gray-400">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
                <i data-lucide="rotate-cw" class="w-4 h-4"></i>
            </div>
            <div class="url-bar">
                <i data-lucide="lock" class="w-3 h-3 text-gray-400 mr-2"></i>
                https://grading-system.edu.cn/exam/1024/grade
            </div>
            <div class="flex gap-2">
                <div class="extension-icon active" onclick="togglePanel()" title="AI Grading Assistant">
                    <i data-lucide="bot" class="w-4 h-4 text-blue-600"></i>
                </div>
                <div class="w-6 h-6 rounded-full bg-gray-300"></div>
            </div>
        </div>

        <div class="browser-content">
            <!-- Mock Third-Party Grading System -->
            <div class="web-page">
                <div class="third-party-header">
                    <span class="font-bold">云阅卷系统 V3.0</span>
                    <div class="text-xs opacity-80">初三历史 / 第 15 题</div>
                </div>
                <div class="p-8 flex justify-center">
                    <div class="bg-white shadow-lg p-8 max-w-3xl w-full min-h-[800px] border border-gray-200">
                        <!-- Mock Student Paper -->
                        <div class="border-b-2 border-red-500 pb-4 mb-6 flex justify-between items-center">
                            <h2 class="text-2xl font-serif text-red-600 font-bold">学生答题卡</h2>
                            <span class="text-red-500 border border-red-500 px-2 py-0.5 text-sm rounded">密卷</span>
                        </div>

                        <div class="mb-4 text-lg font-bold text-gray-800">
                            15. (15分) 阅读材料，回答下列问题。
                        </div>

                        <!-- Simulated Handwriting -->
                        <div
                            class="font-serif text-xl leading-relaxed text-gray-700 bg-gray-50 p-6 rounded-lg border border-gray-100 relative">
                            <p class="mb-4">
                                (1) (4分) <span
                                    class="text-blue-700 font-handwriting">迫切想要打破封建专制制度对经济发展的束缚，使大量农民失去土地。事件：议会第二次召开。特点：时间长、规模大、较彻底。</span>
                            </p>
                            <p>
                                (2) (6分) <span
                                    class="text-blue-700 font-handwriting">农民起义。性质：农民起义虽然失败，但对后期影响深远。原则：互相监督。意义：社会公平公正，民主是主力。</span>
                            </p>

                            <!-- Drawing marks simulation -->
                            <div class="absolute top-10 right-10 opacity-50 pointer-events-none">
                                <svg width="100" height="100" viewBox="0 0 100 100">
                                    <path d="M10,50 Q30,20 50,50 T90,50" fill="none" stroke="red" stroke-width="2" />
                                </svg>
                            </div>
                        </div>

                        <!-- Manual Grading Area -->
                        <div class="mt-8 border-t border-gray-200 pt-6">
                            <div class="flex items-center gap-4">
                                <span class="font-bold text-gray-700">打分:</span>
                                <div class="flex gap-2">
                                    <button class="w-10 h-10 border border-gray-300 rounded hover:bg-gray-50">0</button>
                                    <button class="w-10 h-10 border border-gray-300 rounded hover:bg-gray-50">1</button>
                                    <button class="w-10 h-10 border border-gray-300 rounded hover:bg-gray-50">2</button>
                                    <button
                                        class="w-10 h-10 border border-gray-300 rounded hover:bg-gray-50">...</button>
                                </div>
                                <input type="number" class="w-20 h-10 border border-gray-300 rounded px-2"
                                    placeholder="得分">
                                <button class="px-6 py-2 bg-teal-600 text-white rounded hover:bg-teal-700">提交分数</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Side Panel (Iframe) -->
            <div class="side-panel-container" id="sidePanel">
                <iframe src="grading-side-panel.html" class="w-full h-full border-none"></iframe>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        function togglePanel() {
            const panel = document.getElementById('sidePanel');
            const icon = document.querySelector('.extension-icon');
            panel.classList.toggle('collapsed');
            icon.classList.toggle('active');
        }
    </script>
</body>

</html>
