<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能批改助手 - 智能阅卷状态</title>
    <!-- Tailwind CSS v3 via CDN for prototype -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6;
        }

        /* 模拟 Chrome Side Panel 尺寸 */
        .side-panel {
            width: 400px;
            height: 100vh;
            margin: 0 auto;
            background: #fff;
            border-left: 1px solid #e5e7eb;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #d1d5db;
            border-radius: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        /* 动画 */
        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                opacity: 0.5;
            }

            100% {
                transform: scale(1.2);
                opacity: 0;
            }
        }

        .animate-pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#006FEE', // V2 Primary
                            hover: '#005BC4',
                            subtle: 'rgba(0, 111, 238, 0.1)',
                            fg: '#FFFFFF'
                        },
                        success: {
                            DEFAULT: '#17C964',
                            subtle: 'rgba(23, 201, 100, 0.1)',
                            fg: '#004434'
                        },
                        warning: {
                            DEFAULT: '#F5A524',
                            subtle: 'rgba(245, 165, 36, 0.1)',
                            fg: '#482C03'
                        },
                        danger: {
                            DEFAULT: '#F31260',
                            subtle: 'rgba(243, 18, 96, 0.1)',
                            fg: '#5E0824'
                        },
                        content1: '#FFFFFF',
                        content2: '#F4F4F5',
                        content3: '#E4E4E7',
                        default: {
                            100: '#E4E4E7',
                            200: '#D4D4D8',
                            300: '#A1A1AA',
                            400: '#71717A',
                            500: '#52525B',
                            DEFAULT: '#3F3F46',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-100 p-8 flex justify-center items-start">

    <!-- Design 1: 智能阅卷 (Smart Grading - Active) -->
    <div class="side-panel rounded-xl shadow-2xl relative">
        <!-- Header -->
        <header
            class="h-14 border-b border-gray-100 flex items-center justify-between px-4 bg-white/80 backdrop-blur-md sticky top-0 z-10">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                </div>
                <h1 class="font-bold text-gray-800 text-sm">智能阅卷中...</h1>
            </div>
            <button onclick="window.location.href='grading-dashboard-redesign.html'"
                class="p-2 hover:bg-gray-100 rounded-full transition-colors text-gray-400 hover:text-gray-600">
                <i data-lucide="minimize-2" class="w-4 h-4"></i>
            </button>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-4 flex flex-col gap-6">

            <!-- Progress Circle Hero -->
            <div class="flex flex-col items-center justify-center py-6 relative">
                <!-- Background Pulse -->
                <div class="absolute w-48 h-48 bg-primary/5 rounded-full animate-pulse-ring"></div>

                <div class="relative w-40 h-40">
                    <svg class="w-full h-full" viewBox="0 0 100 100">
                        <!-- Background Circle -->
                        <circle class="text-gray-100" stroke-width="6" stroke="currentColor" fill="transparent" r="42"
                            cx="50" cy="50" />
                        <!-- Progress Circle -->
                        <circle class="text-primary progress-ring__circle" stroke-width="6" stroke-linecap="round"
                            stroke="currentColor" fill="transparent" r="42" cx="50" cy="50" stroke-dasharray="264"
                            stroke-dashoffset="66" />
                    </svg>
                    <!-- Center Content -->
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span class="text-4xl font-bold text-gray-900 tracking-tighter">75%</span>
                        <span class="text-xs font-medium text-gray-500 mt-1">剩余 12 份</span>
                    </div>
                </div>

                <!-- Status Badge -->
                <div
                    class="mt-4 flex items-center gap-2 px-3 py-1.5 bg-primary/10 rounded-full border border-primary/20">
                    <span class="relative flex h-2 w-2">
                        <span
                            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
                    </span>
                    <span class="text-xs font-semibold text-primary">正在分析: 李明 (10302)</span>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-2 gap-3">
                <div
                    class="bg-gray-50 p-3 rounded-xl border border-gray-100 flex flex-col items-center justify-center text-center">
                    <div class="text-gray-400 mb-1"><i data-lucide="check-circle-2" class="w-4 h-4"></i></div>
                    <div class="text-xl font-bold text-gray-800">38</div>
                    <div class="text-[10px] text-gray-500 font-medium uppercase tracking-wide">已批改</div>
                </div>
                <div
                    class="bg-gray-50 p-3 rounded-xl border border-gray-100 flex flex-col items-center justify-center text-center">
                    <div class="text-gray-400 mb-1"><i data-lucide="clock" class="w-4 h-4"></i></div>
                    <div class="text-xl font-bold text-gray-800">1.2s</div>
                    <div class="text-[10px] text-gray-500 font-medium uppercase tracking-wide">平均耗时</div>
                </div>
            </div>

            <!-- Recent Activity Log (Stream) -->
            <div class="flex-1">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider">实时日志</h3>
                    <button class="text-[10px] text-primary hover:underline">查看全部</button>
                </div>
                <div class="space-y-3 relative">
                    <!-- Line connector -->
                    <div class="absolute left-2.5 top-2 bottom-2 w-0.5 bg-gray-200"></div>

                    <!-- Item 1 (Processing) -->
                    <div class="flex gap-3 relative">
                        <div
                            class="w-5 h-5 rounded-full bg-primary border-2 border-white shadow-sm z-10 flex items-center justify-center mt-0.5">
                            <div class="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></div>
                        </div>
                        <div class="flex-1 bg-white p-2.5 rounded-lg border border-gray-200 shadow-sm text-xs">
                            <div class="flex justify-between items-start mb-1">
                                <span class="font-semibold text-gray-800">正在评分...</span>
                                <span class="text-gray-400 text-[10px]">Just now</span>
                            </div>
                            <p class="text-gray-500 line-clamp-1">识别到第 12 题区域，正在请求 AI 模型...</p>
                        </div>
                    </div>

                    <!-- Item 2 (Success) -->
                    <div class="flex gap-3 relative opacity-60">
                        <div
                            class="w-5 h-5 rounded-full bg-success border-2 border-white shadow-sm z-10 flex items-center justify-center mt-0.5 text-white">
                            <i data-lucide="check" class="w-3 h-3"></i>
                        </div>
                        <div class="flex-1 bg-gray-50 p-2.5 rounded-lg border border-gray-100 text-xs">
                            <div class="flex justify-between items-start mb-1">
                                <span class="font-semibold text-gray-700">张伟 - 批改完成</span>
                                <span class="text-primary font-bold">8.0 分</span>
                            </div>
                            <p class="text-gray-400 line-clamp-1">逻辑清晰，要点覆盖全面。</p>
                        </div>
                    </div>

                    <!-- Item 3 (Success) -->
                    <div class="flex gap-3 relative opacity-40">
                        <div
                            class="w-5 h-5 rounded-full bg-success border-2 border-white shadow-sm z-10 flex items-center justify-center mt-0.5 text-white">
                            <i data-lucide="check" class="w-3 h-3"></i>
                        </div>
                        <div class="flex-1 bg-gray-50 p-2.5 rounded-lg border border-gray-100 text-xs">
                            <div class="flex justify-between items-start mb-1">
                                <span class="font-semibold text-gray-700">王强 - 批改完成</span>
                                <span class="text-warning-fg font-bold">5.0 分</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </main>

        <!-- Footer Actions -->
        <footer class="p-4 bg-white border-t border-gray-100">
            <div class="grid grid-cols-2 gap-3">
                <button
                    class="h-10 px-4 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 text-gray-700 font-medium text-sm flex items-center justify-center gap-2 transition-all">
                    <i data-lucide="pause" class="w-4 h-4"></i>
                    暂停
                </button>
                <button onclick="window.location.href='grading-dashboard-redesign.html'"
                    class="h-10 px-4 rounded-lg bg-danger/10 hover:bg-danger/20 text-danger font-medium text-sm flex items-center justify-center gap-2 transition-all">
                    <i data-lucide="square" class="w-4 h-4 fill-current"></i>
                    停止
                </button>
            </div>
        </footer>
    </div>

    <!-- Initialize Lucide icons -->
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
