<!DOCTYPE html>
<html lang="zh-CN" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能阅卷助手 - 生成评分细则 (HeroUI Colorful)</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        // HeroUI Inspired Palette
                        background: '#FFFFFF',
                        foreground: '#11181C',

                        primary: {
                            DEFAULT: '#006FEE',
                            foreground: '#FFFFFF',
                            50: '#E6F1FE',
                            100: '#CCE3FD',
                            200: '#99C7FB',
                            500: '#006FEE',
                            600: '#005BC4',
                        },
                        secondary: {
                            DEFAULT: '#7828C8',
                            foreground: '#FFFFFF',
                            50: '#F2EAFA',
                            100: '#E4D4F4',
                        },
                        success: {
                            DEFAULT: '#17C964',
                            50: '#E8FAF0',
                        },
                        warning: {
                            DEFAULT: '#F5A524',
                            50: '#FEFCE8',
                        },
                        zinc: {
                            50: '#fafafa',
                            100: '#f4f4f5',
                            200: '#e4e4e7',
                            300: '#d4d4d8',
                            400: '#a1a1aa',
                            500: '#71717a',
                            600: '#52525b',
                            700: '#3f3f46',
                            800: '#27272a',
                            900: '#18181b',
                        }
                    },
                    borderRadius: {
                        'medium': '12px',
                        'large': '16px',
                        'xl': '20px',
                        '2xl': '24px',
                        '3xl': '32px',
                    },
                    boxShadow: {
                        'small': '0px 0px 5px 0px rgba(0, 0, 0, 0.02), 0px 2px 10px 0px rgba(0, 0, 0, 0.06)',
                        'medium': '0px 0px 15px 0px rgba(0, 0, 0, 0.03), 0px 2px 30px 0px rgba(0, 0, 0, 0.08), 0px 0px 1px 0px rgba(0, 0, 0, 0.3)',
                        'large': '0 20px 40px -5px rgba(0,0,0,0.1)',
                        'glow-primary': '0 0 20px 0px rgba(0, 111, 238, 0.35)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 20px;
        }

        .phone-container {
            width: 375px;
            height: 667px;
            background-color: white;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-col: column;
            overflow: hidden;
            position: relative;
            border: 4px solid #fff;
            z-index: 10;
        }

        /* Mesh Gradient Background - Consistent with v5 */
        .mesh-bg {
            background-color: #ffffff;
            background-image:
                radial-gradient(at 0% 0%, hsla(210, 100%, 96%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(260, 100%, 96%, 1) 0, transparent 50%),
                radial-gradient(at 100% 100%, hsla(180, 100%, 96%, 1) 0, transparent 50%),
                radial-gradient(at 0% 100%, hsla(300, 100%, 96%, 1) 0, transparent 50%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
        }

        .nav-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        }

        .input-filled {
            background-color: #f4f4f5;
            /* zinc-100 */
            transition: all 0.2s ease;
        }

        .input-filled:hover {
            background-color: #e4e4e7;
            /* zinc-200 */
        }

        .input-filled:focus {
            background-color: white;
            box-shadow: 0 0 0 2px #006FEE;
        }

        /* Custom Scrollbar */
        .scroller::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>

<body>

    <!-- Phone Mockup -->
    <div
        class="phone-container mesh-bg flex flex-col font-sans text-foreground antialiased selection:bg-primary-200 selection:text-primary-800">

        <!-- Immersive Header (Floating) -->
        <header class="h-14 px-4 flex items-center justify-between nav-glass sticky top-0 z-20">
            <!-- Left: Back -->
            <button
                class="w-8 h-8 rounded-full hover:bg-zinc-100 flex items-center justify-center text-zinc-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6" />
                </svg>
            </button>

            <!-- Center: Title -->
            <h1 class="text-base font-bold tracking-tight text-zinc-800">生成评分细则</h1>

            <!-- Right: Actions -->
            <div class="flex items-center gap-2">
                <span
                    class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-gradient-to-r from-warning-50 to-warning-100 text-warning-600 border border-warning-200">
                    试用版
                </span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto px-5 py-4 space-y-6 pb-24 scroller text-sm">

            <!-- Step 1: Upload -->
            <section class="space-y-3">
                <div class="flex items-center gap-2">
                    <span
                        class="flex items-center justify-center w-5 h-5 rounded-full bg-primary text-white text-[10px] font-bold shadow-md shadow-primary/30">1</span>
                    <h2 class="text-sm font-bold text-zinc-700">上传试题图片</h2>
                </div>

                <div class="grid grid-cols-2 gap-3 h-28">
                    <!-- Upload Question -->
                    <div
                        class="h-full rounded-2xl border-2 border-dashed border-primary-200 bg-primary-50/50 hover:bg-primary-50 transition-colors cursor-pointer flex flex-col items-center justify-center gap-2 text-primary-600 group">
                        <div
                            class="w-8 h-8 rounded-full bg-white flex items-center justify-center shadow-sm group-hover:scale-110 transition-transform">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
                                <circle cx="9" cy="9" r="2" />
                                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
                            </svg>
                        </div>
                        <span class="text-[10px] font-bold">上传试题</span>
                    </div>

                    <!-- Upload Answer -->
                    <div
                        class="h-full rounded-2xl border-2 border-dashed border-zinc-200 bg-white/50 hover:bg-zinc-50 transition-colors cursor-pointer flex flex-col items-center justify-center gap-2 text-zinc-400 group hover:border-zinc-300 hover:text-zinc-500">
                        <div
                            class="w-8 h-8 rounded-full bg-white flex items-center justify-center shadow-sm group-hover:scale-110 transition-transform">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <polyline points="17 8 12 3 7 8" />
                                <line x1="12" y1="3" x2="12" y2="15" />
                            </svg>
                        </div>
                        <span class="text-[10px] font-medium">上传答案</span>
                    </div>
                </div>
            </section>

            <!-- Step 2: Basic Info -->
            <section class="space-y-3">
                <div class="flex items-center gap-2">
                    <span
                        class="flex items-center justify-center w-5 h-5 rounded-full bg-secondary text-white text-[10px] font-bold shadow-md shadow-secondary/30">2</span>
                    <h2 class="text-sm font-bold text-zinc-700">设置基本信息</h2>
                </div>

                <div class="glass-card rounded-2xl p-4 space-y-4">
                    <!-- Exam Name -->
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider pl-1">考试名称</label>
                        <div class="flex gap-2">
                            <input type="text" value="2026 春季期中"
                                class="flex-1 px-3 py-2 rounded-xl text-xs font-medium input-filled outline-none text-zinc-800 placeholder-zinc-400">
                            <button
                                class="px-3 py-2 rounded-xl bg-zinc-100 text-zinc-600 font-bold text-xs hover:bg-zinc-200 transition-colors">
                                + 创建
                            </button>
                        </div>
                    </div>

                    <!-- Range & No -->
                    <div class="grid grid-cols-2 gap-3">
                        <div class="space-y-1.5">
                            <label
                                class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider pl-1">批改范围</label>
                            <div class="relative">
                                <select
                                    class="w-full px-3 py-2 rounded-xl text-xs font-medium input-filled outline-none appearance-none text-zinc-800">
                                    <option>整题</option>
                                    <option>小问</option>
                                </select>
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round"
                                    class="absolute right-3 top-2.5 text-zinc-400 pointer-events-none">
                                    <path d="m6 9 6 6 6-6" />
                                </svg>
                            </div>
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider pl-1">题号</label>
                            <input type="number" placeholder="例如: 3"
                                class="w-full px-3 py-2 rounded-xl text-xs font-medium input-filled outline-none text-zinc-800 placeholder-zinc-400">
                        </div>
                    </div>

                    <!-- Subject & Type -->
                    <div class="grid grid-cols-2 gap-3">
                        <div class="space-y-1.5">
                            <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider pl-1">学科</label>
                            <div class="relative">
                                <select
                                    class="w-full px-3 py-2 rounded-xl text-xs font-medium input-filled outline-none appearance-none text-zinc-800">
                                    <option>历史</option>
                                    <option>语文</option>
                                </select>
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round"
                                    class="absolute right-3 top-2.5 text-zinc-400 pointer-events-none">
                                    <path d="m6 9 6 6 6-6" />
                                </svg>
                            </div>
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider pl-1">题型</label>
                            <div class="relative">
                                <select
                                    class="w-full px-3 py-2 rounded-xl text-xs font-medium input-filled outline-none appearance-none text-zinc-800">
                                    <option>材料解析题</option>
                                    <option>简答题</option>
                                </select>
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round"
                                    class="absolute right-3 top-2.5 text-zinc-400 pointer-events-none">
                                    <path d="m6 9 6 6 6-6" />
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Step 3: Rules -->
            <section class="space-y-3">
                <div class="flex items-center gap-2">
                    <span
                        class="flex items-center justify-center w-5 h-5 rounded-full bg-zinc-800 text-white text-[10px] font-bold shadow-md">3</span>
                    <h2 class="text-sm font-bold text-zinc-700">添加特殊规则</h2>
                </div>

                <div class="glass-card rounded-2xl p-4 space-y-3 bg-white/40">
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider pl-1">规则内容</label>
                        <input type="text" placeholder="例如: 每3个错别字"
                            class="w-full px-3 py-2 rounded-xl text-xs font-medium input-filled outline-none text-zinc-800 placeholder-zinc-400">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="space-y-1.5">
                            <label
                                class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider pl-1">计分方式</label>
                            <div class="relative">
                                <select
                                    class="w-full px-3 py-2 rounded-xl text-xs font-medium input-filled outline-none appearance-none text-zinc-800">
                                    <option>扣分</option>
                                    <option>加分</option>
                                </select>
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round"
                                    class="absolute right-3 top-2.5 text-zinc-400 pointer-events-none">
                                    <path d="m6 9 6 6 6-6" />
                                </svg>
                            </div>
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider pl-1">分值</label>
                            <input type="number" placeholder="1"
                                class="w-full px-3 py-2 rounded-xl text-xs font-medium input-filled outline-none text-zinc-800 placeholder-zinc-400">
                        </div>
                    </div>
                </div>
            </section>

        </main>

        <!-- Sticky Footer -->
        <footer
            class="absolute bottom-0 w-full p-4 bg-white/80 backdrop-blur-xl border-t border-white/50 z-30 flex gap-3">
            <button
                class="flex-1 py-3 rounded-2xl bg-zinc-100 text-zinc-500 font-bold text-sm hover:bg-zinc-200 transition-colors">
                清空
            </button>
            <button
                class="flex-[2] py-3 rounded-2xl bg-gradient-to-r from-primary-500 to-primary-600 text-white font-bold text-sm shadow-lg shadow-primary/25 hover:shadow-primary/40 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                    <path d="M3 3v5h5" />
                    <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
                    <path d="M16 16h5v5" />
                </svg>
                生成细则
            </button>
        </footer>

    </div>

</body>

</html>
