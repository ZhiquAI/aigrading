<!DOCTYPE html>
<html lang="zh-CN" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能阅卷助手 - 工作台 (HeroUI Colorful)</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        // HeroUI Inspired Palette
                        background: '#FFFFFF',
                        foreground: '#11181C',

                        primary: {
                            DEFAULT: '#006FEE',
                            foreground: '#FFFFFF',
                            50: '#E6F1FE',
                            100: '#CCE3FD',
                            200: '#99C7FB',
                            500: '#006FEE',
                            600: '#005BC4',
                        },
                        secondary: {
                            DEFAULT: '#7828C8',
                            foreground: '#FFFFFF',
                            50: '#F2EAFA',
                            100: '#E4D4F4',
                            500: '#7828C8',
                        },
                        success: {
                            DEFAULT: '#17C964',
                            50: '#E8FAF0',
                            500: '#17C964',
                        },
                        warning: {
                            DEFAULT: '#F5A524',
                            50: '#FEFCE8',
                            500: '#F5A524',
                            600: '#C27803',
                        },
                    },
                    borderRadius: {
                        'medium': '12px',
                        'large': '16px',
                        'xl': '20px',
                        '2xl': '24px',
                        '3xl': '32px',
                    },
                    boxShadow: {
                        'small': '0px 0px 5px 0px rgba(0, 0, 0, 0.02), 0px 2px 10px 0px rgba(0, 0, 0, 0.06)',
                        'medium': '0px 0px 15px 0px rgba(0, 0, 0, 0.03), 0px 2px 30px 0px rgba(0, 0, 0, 0.08), 0px 0px 1px 0px rgba(0, 0, 0, 0.3)',
                        'large': '0 20px 40px -5px rgba(0,0,0,0.1)',
                        'glow-primary': '0 0 20px 0px rgba(0, 111, 238, 0.35)',
                        'glow-secondary': '0 0 20px 0px rgba(120, 40, 200, 0.35)',
                    },
                    animation: {
                        'gradient': 'gradient 8s ease infinite',
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        gradient: {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 20px;
        }

        .phone-container {
            width: 375px;
            height: 667px;
            background-color: white;
            /* Fallback */
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 4px solid #fff;
            z-index: 10;
        }

        /* Mesh Gradient Background */
        .mesh-bg {
            background-color: #ffffff;
            background-image:
                radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
            /* Using a lighter/colorful mesh for Light mode */
            background-image:
                radial-gradient(at 0% 0%, hsla(210, 100%, 96%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(260, 100%, 96%, 1) 0, transparent 50%),
                radial-gradient(at 100% 100%, hsla(180, 100%, 96%, 1) 0, transparent 50%),
                radial-gradient(at 0% 100%, hsla(300, 100%, 96%, 1) 0, transparent 50%);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
        }

        .nav-glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.01);
        }

        .card-pressable {
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s ease;
        }

        .card-pressable:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.05);
        }

        .card-pressable:active {
            transform: scale(0.96);
        }

        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(to right, #006FEE, #7828C8);
        }
    </style>
</head>

<body>

    <!-- Phone Mockup -->
    <div
        class="phone-container mesh-bg flex flex-col font-sans text-foreground antialiased selection:bg-primary-200 selection:text-primary-800">

        <!-- Immersive Header (Floating) -->
        <header
            class="absolute top-0 w-full p-6 z-20 flex justify-between items-center bg-gradient-to-b from-white/80 to-transparent pointer-events-none">
            <!-- Left: Logo/Brand (Minimal) -->
            <div class="flex items-center gap-2 pointer-events-auto">
                <div
                    class="w-8 h-8 rounded-full bg-white/50 backdrop-blur-md border border-white/50 flex items-center justify-center shadow-sm">
                    <span class="font-bold text-primary-600 text-xs">AI</span>
                </div>
                <span class="text-sm font-bold text-zinc-700/80 backdrop-blur-sm px-2 py-0.5 rounded-lg">智能阅卷</span>
            </div>

            <!-- Right: Status/Actions -->
            <div class="flex items-center gap-2 pointer-events-auto">
                <span
                    class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-white/50 border border-white/50 text-warning-600 backdrop-blur-md shadow-sm">
                    PRO
                </span>
                <button
                    class="w-8 h-8 rounded-full bg-white/50 hover:bg-white flex items-center justify-center text-zinc-600 transition-all shadow-sm backdrop-blur-md">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto px-5 pt-20 pb-24 space-y-5 scroll-smooth">

            <!-- Hero Create Card (Colorful Gradient) -->
            <div
                class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-primary-500 via-primary-600 to-secondary-600 p-6 shadow-large shadow-primary/30 card-pressable cursor-pointer group text-white mt-2">

                <!-- Abstract Blobs -->
                <div
                    class="absolute -top-10 -right-10 w-40 h-40 bg-white/20 rounded-full blur-3xl group-hover:bg-white/30 transition-colors duration-500">
                </div>
                <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-secondary-400/30 rounded-full blur-2xl"></div>

                <div class="relative z-10 flex flex-col h-full justify-between min-h-[140px]">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <div
                                class="px-2 py-0.5 rounded-lg bg-white/20 border border-white/20 text-[10px] font-bold uppercase tracking-wider backdrop-blur-sm self-start">
                                AI 驱动
                            </div>
                        </div>

                        <h2 class="text-2xl font-bold mb-1 tracking-tight">智能创建细则</h2>
                        <p class="text-sm text-white/80 font-medium leading-relaxed max-w-[90%]">
                            让 AI 自动分析试题，<br>一键生成评分标准。
                        </p>
                    </div>

                    <div class="mt-4">
                        <button
                            class="w-full py-3 rounded-2xl bg-white text-primary-600 text-sm font-bold shadow-lg hover:bg-zinc-50 transition-colors flex items-center justify-center gap-2 group-hover:scale-[1.02] active:scale-95 duration-200">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="m5 12 7-7 7 7" />
                                <path d="M12 19V5" />
                            </svg>
                            立即开始创建
                        </button>
                    </div>
                </div>
            </div>

            <!-- Secondary Actions Grid -->
            <div class="grid grid-cols-2 gap-4">
                <!-- Import -->
                <div
                    class="glass-card rounded-2xl p-4 card-pressable cursor-pointer group flex flex-col items-center text-center py-6">
                    <div
                        class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyan-100 to-blue-50 text-cyan-600 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform duration-300 shadow-sm border border-cyan-100">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                    </div>
                    <h3 class="text-sm font-bold text-zinc-800">导入细则</h3>
                    <p class="text-[10px] text-zinc-500 mt-1 font-medium">支持 JSON 文件</p>
                </div>

                <!-- Template -->
                <div
                    class="glass-card rounded-2xl p-4 card-pressable cursor-pointer group flex flex-col items-center text-center py-6">
                    <div
                        class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-100 to-pink-50 text-purple-600 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform duration-300 shadow-sm border border-purple-100">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                    </div>
                    <h3 class="text-sm font-bold text-zinc-800">模板库</h3>
                    <p class="text-[10px] text-zinc-500 mt-1 font-medium">常用标准合集</p>
                </div>
            </div>

            <!-- Recent List -->
            <div>
                <div class="flex items-center justify-between mb-3 px-1">
                    <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">最近记录</h3>
                    <button
                        class="text-[10px] font-bold text-primary hover:text-primary-600 transition-colors bg-white/50 px-2 py-1 rounded-lg">查看全部</button>
                </div>

                <div
                    class="glass-card rounded-3xl border border-white/60 p-6 flex flex-col items-center justify-center text-center min-h-[120px]">
                    <div
                        class="w-12 h-12 rounded-full bg-zinc-50 border border-zinc-100 flex items-center justify-center text-zinc-300 mb-2 grayscale opacity-60">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M12 6v6l4 2" />
                        </svg>
                    </div>
                    <h4 class="text-sm font-bold text-zinc-600">暂无评分记录</h4>
                </div>
            </div>

        </main>

        <!-- Bottom Navigation -->
        <nav
            class="nav-glass h-[72px] absolute bottom-0 w-full flex justify-between items-center px-8 pb-3 safe-area-pb z-20">
            <!-- Item: Active -->
            <button class="flex flex-col items-center justify-center w-auto gap-1 text-primary relative">
                <div
                    class="absolute -top-[18px] w-10 h-1 bg-primary rounded-b-full shadow-[0_4px_12px_rgba(0,111,238,0.5)]">
                </div>
                <div class="w-10 h-10 rounded-xl bg-primary-50/80 flex items-center justify-center mb-0.5 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
                        <polyline points="14 2 14 8 20 8" />
                        <line x1="16" y1="13" x2="8" y2="13" />
                        <line x1="16" y1="17" x2="8" y2="17" />
                        <polyline points="10 9 9 9 8 9" />
                    </svg>
                </div>
                <span class="text-[10px] font-bold">细则</span>
            </button>

            <!-- Item: Inactive -->
            <button
                class="flex flex-col items-center justify-center w-auto gap-1 text-zinc-400 hover:text-zinc-600 transition-colors group">
                <div
                    class="w-10 h-10 flex items-center justify-center group-hover:bg-white/50 rounded-xl transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                </div>
                <span class="text-[10px] font-medium">批改</span>
            </button>

            <!-- Item: Inactive -->
            <button
                class="flex flex-col items-center justify-center w-auto gap-1 text-zinc-400 hover:text-zinc-600 transition-colors group">
                <div
                    class="w-10 h-10 flex items-center justify-center group-hover:bg-white/50 rounded-xl transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <polyline points="12 6 12 12 16 14" />
                    </svg>
                </div>
                <span class="text-[10px] font-medium">历史</span>
            </button>

            <!-- Item: Inactive -->
            <button
                class="flex flex-col items-center justify-center w-auto gap-1 text-zinc-400 hover:text-zinc-600 transition-colors group">
                <div
                    class="w-10 h-10 flex items-center justify-center group-hover:bg-white/50 rounded-xl transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </div>
                <span class="text-[10px] font-medium">设置</span>
            </button>
        </nav>

    </div>

</body>

</html>
