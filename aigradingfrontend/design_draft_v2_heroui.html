<!DOCTYPE html>
<html lang="zh-CN" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能阅卷助手 - 工作台 (HeroUI Style)</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        // HeroUI inspired palette
                        background: '#000000',
                        content1: '#18181b', // zinc-900
                        content2: '#27272a', // zinc-800
                        content3: '#3f3f46', // zinc-700
                        content4: '#52525b', // zinc-600

                        primary: {
                            DEFAULT: '#006FEE',
                            foreground: '#FFFFFF',
                            50: '#E6F1FE',
                            100: '#CCE3FD',
                            200: '#99C7FB',
                            300: '#66AAF9',
                            400: '#338EF7',
                            500: '#006FEE',
                            600: '#005BC4',
                            700: '#004493',
                            800: '#002E62',
                            900: '#001731',
                        },
                        secondary: {
                            DEFAULT: '#9353d3', // Purple
                            foreground: '#FFFFFF',
                        },
                        success: {
                            DEFAULT: '#17c964',
                            foreground: '#000000',
                        },
                        warning: {
                            DEFAULT: '#f5a524',
                            foreground: '#000000',
                        },
                        danger: {
                            DEFAULT: '#f31260',
                            foreground: '#FFFFFF',
                        },
                    },
                    borderRadius: {
                        'large': '14px', // HeroUI default radius
                        'xl': '16px',
                        '2xl': '20px',
                        '3xl': '24px',
                    },
                    boxShadow: {
                        'soft': '0 0 20px 0px rgba(0, 0, 0, 0.1)',
                        'medium': '0 0 40px 0px rgba(0, 0, 0, 0.2)',
                        'glow': '0 0 20px 0px rgba(0, 111, 238, 0.35)',
                    }
                }
            }
        }
    </script>
    <style>
        /* HeroUI Glass Effect */
        .glass {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Sidebar Item Hover Animation */
        .nav-item {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            font-weight: 600;
        }

        /* Card Scale Animation */
        .h-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .h-card:hover {
            transform: scale(1.01);
            box-shadow: 0 0 40px 0px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body
    class="bg-background text-white h-screen flex overflow-hidden antialiased selection:bg-primary selection:text-white">

    <!-- Sidebar -->
    <aside
        class="w-64 h-full border-r border-white/5 flex flex-col bg-background/50 backdrop-blur-xl relative z-20 hidden md:flex">
        <!-- Logo -->
        <div class="h-20 flex items-center px-6 gap-3">
            <div class="w-9 h-9 rounded-xl bg-primary flex items-center justify-center shadow-glow">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                    class="text-white">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                </svg>
            </div>
            <span class="font-bold text-xl tracking-tight">AI Grading</span>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 px-3 py-4 space-y-1">
            <div class="px-3 mb-2 text-xs font-semibold text-zinc-500 uppercase tracking-wider">Main Menu</div>

            <a href="#"
                class="nav-item active flex items-center gap-3 px-3.5 py-2.5 rounded-large text-sm text-zinc-300">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                工作台
            </a>

            <a href="#" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-large text-sm text-zinc-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
                    <polyline points="14 2 14 8 20 8" />
                    <line x1="16" y1="13" x2="8" y2="13" />
                    <line x1="16" y1="17" x2="8" y2="17" />
                    <polyline points="10 9 9 9 8 9" />
                </svg>
                评分细则
            </a>

            <a href="#" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-large text-sm text-zinc-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
                </svg>
                批改记录
            </a>

            <a href="#" class="nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-large text-sm text-zinc-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
                    <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
                </svg>
                数据分析
            </a>
        </nav>

        <!-- User Profile -->
        <div class="p-4 border-t border-white/5">
            <div class="flex items-center gap-3 p-2 rounded-large hover:bg-white/5 cursor-pointer transition-colors">
                <div
                    class="w-10 h-10 rounded-full bg-gradient-to-tr from-secondary to-primary/50 flex items-center justify-center text-sm font-bold">
                    TC
                </div>
                <div class="flex flex-col">
                    <span class="text-sm font-semibold">Teacher Chen</span>
                    <span class="text-xs text-zinc-500">Pro Plan</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-dot-pattern">
        <!-- Blur Background Spot -->
        <div
            class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary/20 rounded-full blur-[120px] pointer-events-none">
        </div>
        <div
            class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-secondary/10 rounded-full blur-[120px] pointer-events-none">
        </div>

        <!-- Topbar -->
        <header
            class="h-16 flex items-center justify-between px-8 border-b border-white/5 glass sticky top-0 z-10 w-full">
            <div class="flex items-center gap-2 text-sm text-zinc-400">
                <span>首页</span>
                <span class="text-zinc-600">/</span>
                <span class="text-white font-medium">工作台</span>
            </div>

            <div class="flex items-center gap-4">
                <button
                    class="w-9 h-9 rounded-full bg-content2 hover:bg-content3 flex items-center justify-center transition-colors text-zinc-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
                        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
                    </svg>
                </button>
                <button
                    class="bg-primary hover:bg-primary-600 text-white px-4 py-1.5 rounded-full text-sm font-medium transition-colors shadow-glow">
                    新建考试
                </button>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-8 scroll-smooth">
            <div class="max-w-7xl mx-auto space-y-8">

                <!-- Welcome Section -->
                <div>
                    <h1 class="text-3xl font-bold mb-2">Welcome back, Chen 👋</h1>
                    <p class="text-zinc-400">这是您这周的阅卷概况 summary</p>
                </div>

                <!-- Stats Cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <!-- Stat 1 -->
                    <div class="bg-content1 rounded-2xl p-5 border border-white/5 h-card">
                        <div class="flex justify-between items-start mb-4">
                            <div class="p-2 rounded-lg bg-primary/10 text-primary">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="8.5" cy="7" r="4"></circle>
                                    <polyline points="17 11 19 13 23 9"></polyline>
                                </svg>
                            </div>
                            <span
                                class="text-xs font-semibold px-2 py-1 rounded-full bg-success/10 text-success">+12%</span>
                        </div>
                        <div class="text-2xl font-bold mb-1">1,204</div>
                        <div class="text-xs text-zinc-500">本周批改试卷</div>
                    </div>

                    <!-- Stat 2 -->
                    <div class="bg-content1 rounded-2xl p-5 border border-white/5 h-card">
                        <div class="flex justify-between items-start mb-4">
                            <div class="p-2 rounded-lg bg-secondary/10 text-secondary">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                                </svg>
                            </div>
                        </div>
                        <div class="text-2xl font-bold mb-1">85%</div>
                        <div class="text-xs text-zinc-500">通过率</div>
                    </div>
                </div>

                <!-- Main Actions Grid -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                    <!-- Create Action (Large) -->
                    <div
                        class="md:col-span-2 relative overflow-hidden rounded-3xl bg-gradient-to-br from-primary to-primary-700 p-8 shadow-glow h-card group cursor-pointer border border-white/10">
                        <div
                            class="absolute top-0 right-0 -mt-10 -mr-10 w-64 h-64 bg-white/10 rounded-full blur-3xl group-hover:bg-white/20 transition-all duration-500">
                        </div>

                        <div class="relative z-10 h-full flex flex-col justify-between">
                            <div>
                                <span
                                    class="inline-block px-3 py-1 rounded-full bg-black/20 text-xs font-medium text-white/80 border border-white/10 mb-4">Core
                                    Feature</span>
                                <h2 class="text-3xl font-bold mb-2">智能创建评分细则</h2>
                                <p class="text-primary-100 max-w-md">上传试题图片和标准答案，AI 将自动分析并生成结构化的评分标准。支持多维度打分策略。</p>
                            </div>

                            <div class="flex items-center gap-2 mt-8">
                                <span class="font-semibold text-white group-hover:underline">开始创建</span>
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="transition-transform group-hover:translate-x-1">
                                    <path d="M5 12h14M12 5l7 7-7 7" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Secondary Actions Stack -->
                    <div class="space-y-6">
                        <!-- Import Card -->
                        <div
                            class="bg-content1 rounded-3xl p-6 border border-white/5 h-card cursor-pointer group hover:bg-content2 transition-colors">
                            <div
                                class="w-12 h-12 rounded-2xl bg-zinc-800 flex items-center justify-center mb-4 group-hover:bg-zinc-700 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="text-zinc-400 group-hover:text-white">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                    <polyline points="7 10 12 15 17 10" />
                                    <line x1="12" y1="15" x2="12" y2="3" />
                                </svg>
                            </div>
                            <h3 class="text-xl font-bold mb-1">导入 JSON</h3>
                            <p class="text-sm text-zinc-500">从本地文件恢复细则配置</p>
                        </div>

                        <!-- Templates Card -->
                        <div
                            class="bg-content1 rounded-3xl p-6 border border-white/5 h-card cursor-pointer group hover:bg-content2 transition-colors">
                            <div
                                class="w-12 h-12 rounded-2xl bg-zinc-800 flex items-center justify-center mb-4 group-hover:bg-zinc-700 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="text-zinc-400 group-hover:text-white">
                                    <rect x="3" y="3" width="7" height="7"></rect>
                                    <rect x="14" y="3" width="7" height="7"></rect>
                                    <rect x="14" y="14" width="7" height="7"></rect>
                                    <rect x="3" y="14" width="7" height="7"></rect>
                                </svg>
                            </div>
                            <h3 class="text-xl font-bold mb-1">模板库</h3>
                            <p class="text-sm text-zinc-500">管理常用评分标准模板</p>
                        </div>
                    </div>

                </div>

                <!-- Recent Table -->
                <div class="bg-content1 rounded-3xl border border-white/5 overflow-hidden">
                    <div class="p-6 border-b border-white/5 flex justify-between items-center">
                        <h3 class="font-bold text-lg">最近细则</h3>
                        <button class="text-sm text-primary hover:text-primary-400 transition-colors">查看全部</button>
                    </div>
                    <div class="p-8 text-center text-zinc-500 py-16">
                        暂无数据
                    </div>
                </div>

            </div>
        </div>
    </main>

</body>

</html>
