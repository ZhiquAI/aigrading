<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生成评分细则 - 表格简化版 v9</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans SC"', 'sans-serif']
          },
          colors: {
            wave: '#2C6EF2',
            mint: '#11B686',
            amber: '#F59E0B',
            coral: '#F06543'
          },
          boxShadow: {
            card: '0 14px 30px -18px rgba(16, 24, 40, 0.35)'
          }
        }
      }
    }
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 10%, rgba(44, 110, 242, 0.14), transparent 35%),
        radial-gradient(circle at 90% 15%, rgba(17, 182, 134, 0.12), transparent 30%),
        #ecf3ff;
      display: flex;
      justify-content: center;
      padding: 20px 12px;
      color: #10243f;
      font-family: "Noto Sans SC", sans-serif;
    }

    .phone {
      width: 390px;
      min-height: 844px;
      border-radius: 28px;
      border: 4px solid #fff;
      background: linear-gradient(170deg, #fcfeff 0%, #f2f7ff 100%);
      box-shadow: 0 26px 55px -24px rgba(19, 33, 58, 0.42);
      overflow: hidden;
      position: relative;
    }

    .glass {
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.95);
    }

    .scrollbar-none::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .strategy-pickn {
      border-color: #93c5fd;
      background: #eff6ff;
    }
  </style>
</head>

<body>
  <div class="phone">
    <header class="sticky top-0 z-30 h-14 px-4 flex items-center justify-between border-b border-white/70 bg-white/80 backdrop-blur-xl">
      <button class="w-8 h-8 rounded-full grid place-items-center text-slate-600 hover:bg-slate-100" aria-label="返回">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h1 class="text-[17px] font-black tracking-tight">生成评分细则</h1>
      <span class="px-2 py-0.5 text-[10px] font-bold rounded-full border border-amber-200 bg-amber-50 text-amber-700">试用版</span>
    </header>

    <main class="h-[calc(100%-56px)] overflow-y-auto scrollbar-none px-3 py-3 space-y-3 pb-24">
      <section class="glass rounded-3xl p-3 shadow-card">
        <div class="flex items-center gap-2 mb-2">
          <span class="w-5 h-5 rounded-full bg-[#6135D1] text-white text-[10px] font-black grid place-items-center">2</span>
          <h2 class="text-sm font-black">设置基本信息</h2>
        </div>

        <div class="grid grid-cols-[1fr_auto] gap-2 items-end">
          <label class="block">
            <p class="text-[10px] font-bold text-slate-500 mb-1">考试名称</p>
            <input value="期末考试" class="w-full h-10 rounded-xl bg-slate-100 border border-transparent px-3 text-sm font-semibold" />
          </label>
          <button class="h-10 px-3 rounded-xl bg-white border border-slate-200 text-sm font-bold text-slate-700">+ 创建</button>
        </div>

        <div class="grid grid-cols-2 gap-2 mt-2">
          <label class="block">
            <p class="text-[10px] font-bold text-slate-500 mb-1">学科</p>
            <input value="历史" class="w-full h-10 rounded-xl bg-slate-100 border border-transparent px-3 text-sm font-semibold" />
          </label>
          <label class="block">
            <p class="text-[10px] font-bold text-slate-500 mb-1">学段</p>
            <input value="高中" class="w-full h-10 rounded-xl bg-slate-100 border border-transparent px-3 text-sm font-semibold" />
          </label>
        </div>

        <div class="grid grid-cols-3 gap-2 mt-2">
          <label class="block">
            <p class="text-[10px] font-bold text-slate-500 mb-1">题号</p>
            <input value="13" class="w-full h-10 rounded-xl bg-slate-100 border border-transparent px-3 text-sm font-semibold" />
          </label>
          <label class="block">
            <p class="text-[10px] font-bold text-slate-500 mb-1">总分</p>
            <input value="10" class="w-full h-10 rounded-xl bg-slate-100 border border-transparent px-3 text-sm font-semibold" />
          </label>
          <label class="block">
            <p class="text-[10px] font-bold text-slate-500 mb-1">问数</p>
            <input value="3" class="w-full h-10 rounded-xl bg-slate-100 border border-transparent px-3 text-sm font-semibold" />
          </label>
        </div>
      </section>

      <section class="glass rounded-3xl p-3 shadow-card space-y-2.5">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="w-5 h-5 rounded-full bg-mint text-white text-[10px] font-black grid place-items-center">3</span>
            <h2 class="text-sm font-black">配置评分策略（表格版）</h2>
          </div>
          <span class="text-[10px] font-bold text-wave bg-wave/10 rounded-full px-2 py-0.5">第13题</span>
        </div>

        <div class="rounded-xl border border-slate-200 bg-white px-2.5 py-2 space-y-1">
          <p class="text-[10px] font-semibold text-slate-600">当前题号：<span class="font-black text-wave">13</span>（来自基本信息）</p>
          <p class="text-[10px] font-semibold text-slate-600">说明：<span class="font-black text-wave">1 行 = 1 个评分点</span>，直接按表格填写。第2问/第3问通常各拆成2个评分点。</p>
        </div>

        <div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white">
          <table class="min-w-[620px] w-full text-[11px]">
            <thead class="bg-slate-100 text-slate-700">
              <tr>
                <th class="text-left px-2.5 py-2 font-black w-28">子题号</th>
                <th class="text-left px-2.5 py-2 font-black w-20">分值</th>
                <th class="text-left px-2.5 py-2 font-black">评分点</th>
                <th class="text-left px-2.5 py-2 font-black w-40">评分策略</th>
              </tr>
            </thead>
            <tbody id="scoreTableBody"></tbody>
          </table>
        </div>

        <div class="rounded-2xl border border-amber-200 bg-amber-50 p-2.5">
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="rounded-lg bg-white/90 border border-amber-100 p-1.5">
              <p class="text-[9px] text-amber-700">目标总分</p>
              <p class="text-xs font-black text-amber-900">10</p>
            </div>
            <div class="rounded-lg bg-white/90 border border-amber-100 p-1.5">
              <p class="text-[9px] text-amber-700">当前汇总</p>
              <p class="text-xs font-black text-amber-900" id="sumScore">10</p>
            </div>
            <div class="rounded-lg bg-white/90 border border-amber-100 p-1.5">
              <p class="text-[9px] text-amber-700">待完善</p>
              <p class="text-xs font-black text-coral" id="todoCount">0</p>
            </div>
          </div>
          <p class="text-[10px] font-semibold text-amber-800 mt-1" id="tableHint">提示：第3问已拆成“史事 + 认识”，不会串分。</p>
        </div>
      </section>

      <section class="glass rounded-3xl p-3 shadow-card space-y-2.5">
        <div class="flex items-center gap-2">
          <span class="w-5 h-5 rounded-full bg-coral text-white text-[10px] font-black grid place-items-center">4</span>
          <h2 class="text-sm font-black">添加特殊规则</h2>
        </div>

        <div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white">
          <table class="min-w-[540px] w-full text-[11px]">
            <thead class="bg-slate-100 text-slate-700">
              <tr>
                <th class="text-left px-2.5 py-2 font-black w-24">作用范围</th>
                <th class="text-left px-2.5 py-2 font-black">规则内容</th>
                <th class="text-left px-2.5 py-2 font-black w-24">计分</th>
              </tr>
            </thead>
            <tbody>
              <tr class="border-t border-slate-100">
                <td class="px-2.5 py-2 text-slate-700 font-bold">第3问</td>
                <td class="px-2.5 py-2 text-slate-700">若出现“郑和”但未提及“下西洋”</td>
                <td class="px-2.5 py-2 text-slate-700 font-black">扣1分</td>
              </tr>
              <tr class="border-t border-slate-100">
                <td class="px-2.5 py-2 text-slate-700 font-bold">第2问</td>
                <td class="px-2.5 py-2 text-slate-700">“历史价值”和“举措”不得交叉记分</td>
                <td class="px-2.5 py-2 text-slate-700 font-black">校验</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <div class="h-20"></div>
    </main>

    <footer class="absolute bottom-0 left-0 right-0 h-20 px-3 border-t border-white/70 bg-white/86 backdrop-blur-xl flex items-center gap-2.5">
      <button class="h-11 flex-1 rounded-2xl bg-slate-100 text-sm font-black text-slate-600">清空</button>
      <button class="h-11 flex-[1.7] rounded-2xl bg-gradient-to-r from-wave to-[#3f8bff] text-white text-sm font-black shadow-card">生成细则</button>
    </footer>
  </div>

  <script>
    const groups = [
      {
        id: '13-1',
        title: '第1问（3分）',
        open: true,
        rows: [
          { key: '13-1-a', point: '华夏族', strategy: 'weighted', score: 1 },
          { key: '13-1-b', point: '仁', strategy: 'weighted', score: 1 },
          { key: '13-1-c', point: '大学', strategy: 'weighted', score: 1 }
        ]
      },
      {
        id: '13-2',
        title: '第2问（4分）',
        open: true,
        rows: [
          { key: '13-2-a', point: '历史价值（任答2点）', strategy: 'pick_n', score: 2, maxPoints: 2, pointValue: 1 },
          { key: '13-2-b', point: '举措（任答2点）', strategy: 'pick_n', score: 2, maxPoints: 2, pointValue: 1 }
        ]
      },
      {
        id: '13-3',
        title: '第3问（3分）',
        open: true,
        rows: [
          { key: '13-3-a', point: '史事：郑和下西洋', strategy: 'all', score: 1 },
          { key: '13-3-b', point: '认识（任答2点）', strategy: 'pick_n', score: 2, maxPoints: 2, pointValue: 1 }
        ]
      }
    ];

    const tableBody = document.getElementById('scoreTableBody');
    const sumScore = document.getElementById('sumScore');
    const todoCount = document.getElementById('todoCount');
    const tableHint = document.getElementById('tableHint');

    function computeStats() {
      let sum = 0;
      let todo = 0;
      let mixRisk = 0;

      groups.forEach((g) => {
        sum += g.rows.reduce((acc, row) => acc + (Number(row.score) || 0), 0);
        if (g.rows.length === 1 && (g.id === '13-2' || g.id === '13-3')) mixRisk += 1;

        g.rows.forEach((row) => {
          if (!row.point || !row.point.trim()) todo += 1;
          if (row.strategy === 'pick_n') {
            if (!(Number(row.maxPoints) > 0) || !(Number(row.pointValue) > 0)) todo += 1;
          }
        });
      });

      return { sum, todo, mixRisk };
    }

    function render() {
      tableBody.innerHTML = groups.map((group) => {
        const groupHeader = `
          <tr class="border-t border-slate-100 bg-[#f8fbff]">
            <td colspan="4" class="px-2.5 py-2">
              <button class="w-full flex items-center justify-between text-left" data-group="${group.id}" data-action="toggle">
                <span class="font-black text-slate-800">${group.title}</span>
                <span class="text-[10px] font-bold text-wave">${group.open ? '收起' : '展开'}</span>
              </button>
            </td>
          </tr>
        `;

        if (!group.open) return groupHeader;

        const rows = group.rows.map((row, index) => {
          const strategyClass = row.strategy === 'pick_n' ? 'strategy-pickn' : '';
          const pickNExtras = row.strategy === 'pick_n'
            ? `
              <div class="mt-1 grid grid-cols-2 gap-1">
                <input data-group="${group.id}" data-index="${index}" data-field="maxPoints" value="${row.maxPoints || ''}" class="h-7 rounded-md border border-slate-200 px-2 text-[10px] font-semibold" placeholder="maxPoints" />
                <input data-group="${group.id}" data-index="${index}" data-field="pointValue" value="${row.pointValue || ''}" class="h-7 rounded-md border border-slate-200 px-2 text-[10px] font-semibold" placeholder="pointValue" />
              </div>
            `
            : '';

          return `
            <tr class="border-t border-slate-100 ${strategyClass}">
              <td class="px-2.5 py-2 font-semibold text-slate-700">${row.key}</td>
              <td class="px-2.5 py-2">
                <input data-group="${group.id}" data-index="${index}" data-field="score" value="${row.score}" class="w-full h-8 rounded-md border border-slate-200 px-2 text-[10px] font-black text-slate-700" />
              </td>
              <td class="px-2.5 py-2">
                <input data-group="${group.id}" data-index="${index}" data-field="point" value="${row.point}" class="w-full h-8 rounded-md border border-slate-200 px-2 text-[10px] font-semibold" />
              </td>
              <td class="px-2.5 py-2">
                <select data-group="${group.id}" data-index="${index}" data-field="strategy" class="w-full h-8 rounded-md border border-slate-200 px-2 text-[10px] font-bold text-slate-700 bg-white">
                  <option value="weighted" ${row.strategy === 'weighted' ? 'selected' : ''}>weighted</option>
                  <option value="all" ${row.strategy === 'all' ? 'selected' : ''}>all</option>
                  <option value="pick_n" ${row.strategy === 'pick_n' ? 'selected' : ''}>pick_n</option>
                </select>
                ${pickNExtras}
              </td>
            </tr>
          `;
        }).join('');

        return groupHeader + rows;
      }).join('');

      const stats = computeStats();
      sumScore.textContent = String(stats.sum);
      todoCount.textContent = String(stats.todo);

      if (stats.mixRisk === 0) {
        tableHint.textContent = '提示：第2问和第3问均已按评分点拆开，评分更稳定。';
      } else {
        tableHint.textContent = `提示：仍有 ${stats.mixRisk} 个混合问未拆分，建议至少拆成2个评分点。`;
      }

      tableBody.querySelectorAll('[data-action="toggle"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.group;
          const target = groups.find((g) => g.id === id);
          if (!target) return;
          target.open = !target.open;
          render();
        });
      });

      tableBody.querySelectorAll('input[data-field], select[data-field]').forEach((el) => {
        el.addEventListener('change', () => {
          const groupId = el.dataset.group;
          const idx = Number(el.dataset.index || '-1');
          const field = el.dataset.field;
          const group = groups.find((g) => g.id === groupId);
          if (!group || idx < 0 || idx >= group.rows.length) return;

          const row = group.rows[idx];
          row[field] = el.value;

          if (field === 'strategy' && row.strategy !== 'pick_n') {
            delete row.maxPoints;
            delete row.pointValue;
          }
          if (field === 'strategy' && row.strategy === 'pick_n') {
            row.maxPoints = row.maxPoints || 1;
            row.pointValue = row.pointValue || 1;
          }

          render();
        });
      });
    }

    render();
  </script>
</body>

</html>
