<!DOCTYPE html>
<html lang="zh-CN" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能阅卷助手 - 评分细则</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '"Noto Sans SC"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            400: '#38bdf8',
                            50: '#0ea5e9', // Primary Blue
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        },
                        accent: {
                            purple: '#8b5cf6', // Violet
                            pink: '#ec4899',   // Pink
                            orange: '#f97316', // Orange
                        },
                        dark: {
                            bg: '#0f172a',     // Slate 900
                            card: '#1e293b',   // Slate 800
                            border: '#334155', // Slate 700
                            text: '#f8fafc',   // Slate 50
                            muted: '#94a3b8',  // Slate 400
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .gradient-text {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(to right, #38bdf8, #8b5cf6);
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px -10px rgba(14, 165, 233, 0.2);
            border-color: rgba(56, 189, 248, 0.4);
        }
    </style>
</head>

<body
    class="bg-dark-bg text-dark-text h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white overflow-hidden">

    <!-- Header -->
    <header
        class="h-16 border-b border-dark-border/50 bg-dark-bg/80 backdrop-blur-md fixed top-0 w-full z-50 flex items-center justify-between px-4">
        <div class="flex items-center gap-3">
            <div
                class="w-8 h-8 rounded-xl bg-gradient-to-br from-brand-500 to-accent-purple flex items-center justify-center shadow-lg shadow-brand-500/20">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                    class="text-white">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                </svg>
            </div>
            <h1 class="font-bold text-lg tracking-tight">评分细则</h1>
        </div>

        <div class="flex items-center gap-3">
            <div
                class="h-8 px-3 rounded-full bg-dark-card border border-dark-border/50 flex items-center gap-2 text-xs font-medium text-dark-muted">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                普通版
            </div>
            <button
                class="w-8 h-8 rounded-full bg-dark-card hover:bg-white/5 border border-dark-border/50 flex items-center justify-center transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="text-dark-muted">
                    <path
                        d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto pt-20 pb-24 px-4 scroll-smooth">

        <div class="mb-6 animate-float">
            <div
                class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-brand-600 via-brand-500 to-accent-purple p-6 shadow-xl shadow-brand-500/20 group cursor-pointer transition-all hover:scale-[1.02] border border-brand-400/20">

                <!-- Background decorative elements -->
                <div class="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
                <div class="absolute bottom-0 left-0 -mb-10 -ml-10 w-32 h-32 bg-accent-purple/30 rounded-full blur-2xl">
                </div>

                <div class="relative z-10 flex flex-col h-full justify-between">
                    <div class="flex justify-between items-start">
                        <div
                            class="p-2.5 bg-white/20 backdrop-blur-md rounded-xl inline-flex shadow-inner border border-white/20">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="text-white">
                                <path d="M12 5v14M5 12h14" />
                            </svg>
                        </div>
                        <span
                            class="text-[10px] font-bold uppercase tracking-wider text-white/80 bg-black/20 px-2 py-0.5 rounded border border-white/10">AI
                            Powered</span>
                    </div>

                    <div class="mt-4">
                        <h2 class="text-xl font-bold text-white mb-1.5 flex items-center gap-2">
                            创建细则
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                stroke-linejoin="round"
                                class="text-white/70 group-hover:translate-x-1 transition-transform">
                                <path d="M5 12h14M12 5l7 7-7 7" />
                            </svg>
                        </h2>
                        <p class="text-brand-50 text-sm font-medium leading-relaxed opacity-90">
                            从试题与答案图自动生成，<br>体验智能解析的魅力。
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 gap-4">
            <!-- Import Card -->
            <div class="glass-panel p-5 rounded-2xl card-hover cursor-pointer group">
                <div class="flex items-start gap-4">
                    <div
                        class="p-3 rounded-xl bg-dark-bg border border-dark-border group-hover:border-brand-500/50 group-hover:text-brand-400 transition-colors text-dark-muted">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                    </div>
                    <div class="flex-1">
                        <h3
                            class="text-base font-semibold text-dark-text mb-1 group-hover:text-brand-400 transition-colors">
                            导入细则</h3>
                        <p class="text-sm text-dark-muted leading-tight">从本地 JSON 文件恢复编辑</p>
                    </div>
                    <div
                        class="self-center opacity-0 group-hover:opacity-100 transition-opacity -translate-x-2 group-hover:translate-x-0 transition-transform">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="text-dark-muted">
                            <path d="M9 18l6-6-6-6" />
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Templates Card -->
            <div class="glass-panel p-5 rounded-2xl card-hover cursor-pointer group relative overflow-hidden">
                <div class="flex items-start gap-4">
                    <div
                        class="p-3 rounded-xl bg-dark-bg border border-dark-border group-hover:border-accent-purple/50 group-hover:text-accent-purple transition-colors text-dark-muted">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-center mb-1">
                            <h3
                                class="text-base font-semibold text-dark-text group-hover:text-accent-purple transition-colors">
                                模板库</h3>
                            <span
                                class="text-xs font-bold bg-dark-bg border border-dark-border px-2 py-0.5 rounded text-dark-muted group-hover:text-accent-purple group-hover:border-accent-purple/30 transition-colors">0</span>
                        </div>
                        <p class="text-sm text-dark-muted leading-tight">管理常用评分标准</p>
                    </div>
                </div>
            </div>

            <!-- Recent Activity (Optional placeholder) -->
            <div class="mt-4">
                <h4 class="text-xs font-bold text-dark-muted uppercase tracking-wider mb-3 px-1">最近使用</h4>
                <div
                    class="glass-panel p-4 rounded-xl border-dashed border-2 border-dark-border flex flex-col items-center justify-center text-center py-8">
                    <div
                        class="w-12 h-12 rounded-full bg-dark-bg flex items-center justify-center mb-3 text-dark-muted">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M12 6v6l4 2" />
                        </svg>
                    </div>
                    <p class="text-sm text-dark-muted">暂无最近的评分记录</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav
        class="h-[72px] bg-dark-bg/90 backdrop-blur-xl border-t border-dark-border fixed bottom-0 w-full z-50 px-6 pb-2 safe-area-pb">
        <div class="flex justify-between items-center h-full">
            <!-- Item: Active -->
            <button class="nav-item group flex flex-col items-center justify-center w-16 gap-1 relative">
                <div
                    class="absolute -top-3 w-8 h-1 bg-brand-500 rounded-b-full shadow-[0_4px_12px_rgba(14,165,233,0.5)]">
                </div>
                <div
                    class="w-10 h-10 rounded-xl bg-brand-500/10 flex items-center justify-center text-brand-400 mb-0.5 group-hover:scale-110 transition-transform duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
                        <polyline points="14 2 14 8 20 8" />
                        <line x1="16" y1="13" x2="8" y2="13" />
                        <line x1="16" y1="17" x2="8" y2="17" />
                        <polyline points="10 9 9 9 8 9" />
                    </svg>
                </div>
                <span class="text-[10px] font-bold text-brand-400">细则</span>
            </button>

            <!-- Item: Inactive -->
            <button class="nav-item group flex flex-col items-center justify-center w-16 gap-1">
                <div
                    class="w-10 h-10 rounded-xl hover:bg-white/5 flex items-center justify-center text-dark-muted transition-colors group-hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                </div>
                <span class="text-[10px] font-medium text-dark-muted group-hover:text-white transition-colors">批改</span>
            </button>

            <!-- Item: Inactive -->
            <button class="nav-item group flex flex-col items-center justify-center w-16 gap-1">
                <div
                    class="w-10 h-10 rounded-xl hover:bg-white/5 flex items-center justify-center text-dark-muted transition-colors group-hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <polyline points="12 6 12 12 16 14" />
                    </svg>
                </div>
                <span class="text-[10px] font-medium text-dark-muted group-hover:text-white transition-colors">历史</span>
            </button>

            <!-- Item: Inactive -->
            <button class="nav-item group flex flex-col items-center justify-center w-16 gap-1">
                <div
                    class="w-10 h-10 rounded-xl hover:bg-white/5 flex items-center justify-center text-dark-muted transition-colors group-hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </div>
                <span class="text-[10px] font-medium text-dark-muted group-hover:text-white transition-colors">设置</span>
            </button>
        </div>
    </nav>

</body>

</html>
