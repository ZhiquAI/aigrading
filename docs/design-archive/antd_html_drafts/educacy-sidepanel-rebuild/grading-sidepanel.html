<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>侧边栏版 - 阅卷模块</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./shared.css" />
</head>
<body>
  <div class="frame">
    <div class="panel">
      <header class="topbar">
        <div class="brand"><span class="logo"></span><div><h1>Grading Studio</h1><p>AI 阅卷与复核</p></div></div>
        <div class="top-actions"><button class="cta">开始</button><span class="icon-btn">A</span></div>
      </header>

      <main class="content">
        <div class="grid-2">
          <article class="metric"><p>今日完成</p><strong>187</strong><small>+21%</small></article>
          <article class="metric"><p>平均耗时</p><strong>11s</strong><small>每份答卷</small></article>
          <article class="metric"><p>需复核</p><strong>23</strong><small>12.3%</small></article>
          <article class="metric"><p>当前额度</p><strong>1246</strong><small>可用</small></article>
        </div>

        <section class="surface">
          <header class="surface-head"><h3>当前结果</h3><span class="status warn">自动提交 06s</span></header>
          <div class="surface-body">
            <div class="meta">第15题 · 历史论述题 · weighted</div>
            <h4 style="margin:0;font-size:36px;letter-spacing:-.04em;color:#1f3fa9;">16.5 <span style="font-size:14px;color:#7f8da4;">/ 18</span></h4>
            <div class="meta">AI 判定：观点完整，证据链较充分；第二条史料出处缺失，扣1.5分。</div>
            <div class="progress"><span style="width:92%"></span></div>
            <div class="btn-row"><button class="btn ghost">放弃</button><button class="btn solid">确认并下一份</button></div>
          </div>
        </section>

        <section class="surface">
          <header class="surface-head"><h3>得分点命中</h3><span class="meta">4 / 6</span></header>
          <div class="surface-body card-list">
            <article class="card"><div class="card-top"><span class="badge ok">已命中</span><span class="meta">+4.0</span></div><h4>观点明确，结论指向清晰</h4></article>
            <article class="card"><div class="card-top"><span class="badge ok">已命中</span><span class="meta">+3.0</span></div><h4>引用2条有效史料并完成解释</h4></article>
            <article class="card"><div class="card-top"><span class="badge warn">未命中</span><span class="meta">0.0</span></div><h4>缺少“社会结构变化”对比论证</h4></article>
          </div>
        </section>
      </main>

      <nav class="bottom-nav">
        <a href="./rubric-sidepanel.html">细则</a>
        <a class="active" href="./grading-sidepanel.html">阅卷</a>
        <a href="./records-sidepanel.html">记录</a>
        <a href="./settings-sidepanel.html">设置</a>
      </nav>
    </div>
  </div>
</body>
</html>
